# Workaround for https://github.com/RoboStack/ros-jazzy/pull/40#issuecomment-2782226697
cmake:
  - 3.*

cdt_name:  # [linux]
  - conda  # [linux]

# Multi-python-version experiment (see README-multi-python.md): a real
# matrix for non-emscripten platforms instead of a single pinned version,
# so that packages vinca now classifies as actually needing Python (see
# vinca's _package_needs_python, RoboStack/vinca#153) get built once per
# version here, while everything else still builds exactly once
# regardless of how many entries this list has. emscripten intentionally
# left untouched (single pin, unrelated to this experiment).
python:
  - 3.11.* *_cpython  # [emscripten]
  - 3.11.* *_cpython  # [not emscripten]
  - 3.12.* *_cpython  # [not emscripten]
  - 3.13.* *_cp313    # [not emscripten]
# Minimum supported Python version, per CFEP-25 -- used by vinca (from
# RoboStack/vinca#153 onward) to pin the build-time-only Python interpreter
# every ament_cmake recipe needs regardless of its own Python content, so
# that entry doesn't drag every single recipe into the full version matrix
# above. Falls back to 3.11 on vinca's side if this key is ever removed.
python_min:
  - '3.11'
python_impl:
  - cpython

emscripten_emscripten-wasm32:
  - 3.1.45
cross-python_emscripten-wasm32:
  - 3.11.* *_12

c_compiler:
  - gcc                        # [linux]
  - clang                      # [osx]
  - vs2022                     # [win]
  - emscripten                 # [emscripten]
c_compiler_version:            # [unix]
  - 14                         # [linux]
  - 18                         # [osx]
c_stdlib:
  - sysroot                    # [linux]
  - macosx_deployment_target   # [osx]
  - vs                         # [win]
c_stdlib_version:              # [unix]
  - 2.17                       # [linux]
  - 10.13                      # [osx and x86_64]
  - 11.0                       # [osx and arm64]
cxx_compiler:
  - gxx                        # [linux]
  - clangxx                    # [osx]
  - vs2022                     # [win]
  - emscripten                 # [emscripten]
cxx_compiler_version:          # [unix]
  - 14                         # [linux]
  - 18                         # [osx]

libzenohc:
  - 1.9.0
libzenohcxx:
  - 1.9.0

libhwloc:
  - 2.12.2

lbr_fri_client_sdk:
  - '1.11'
  - '1.14'
  - '1.15'
  - '1.16'
  - '1.17'

eigen_abi_devel:
  - '3.4.0'

poco:
