python_qt_binding:
  # ROS still ships this at 1.1.3, using PySide2/PyQt5 (qtbase5-dev, python3-qt5-bindings
  # in package.xml). pyside2 has no python 3.14 build; port to PyQt6 instead (patch swaps
  # sip_helper.cmake's Qt5-only find_package + __init__.py's PySide/PyQt5 imports).
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  add_host: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
  add_run: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
qt_gui:
  # Same PyQt6 port as python_qt_binding/qt_gui_cpp below (package.xml: qt5-qmake,
  # python3-qt5-bindings).
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  add_host: ["qt6-main", "pyqt6"]
  add_run: ["qt6-main", "pyqt6"]
qt_gui_cpp:
  # Ported to PyQt6 (see patch/ros-humble-qt-gui-cpp.patch): the shiboken/PySide2
  # binding is dropped (pyside2 has no python 3.14 build), the SIP binding's hardcoded
  # Qt5Widgets find_package becomes generic, and the sip type system gets a Qt6 variant.
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  add_build: ["${{ 'pyqt6' if (build_platform != target_platform) }}", "${{ 'qt6-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pyqt-builder", "pep517", "qt6-main", "pyqt6"]
  add_run: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
rqt_gui_cpp:
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_py_common:
  remove_host: ["qt-main"]
  add_host: ["qt6-main"]
