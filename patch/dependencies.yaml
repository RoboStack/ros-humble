  # qt_gui_cpp is declared in rtabmap's package.xml but never referenced by its
  # CMakeLists.txt (it is for the optional Qt guilib/app, disabled via WITH_QT=OFF
  # in pkg_additional_info.yaml) -- drop it so it does not pull in Qt at all.
  remove_host: ["ros-humble-qt-gui-cpp"]
  remove_run: ["ros-humble-qt-gui-cpp"]
