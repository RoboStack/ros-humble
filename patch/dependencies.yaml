cartographer:
  # This is the dummy package for ros-humble-cartographer (build script is empty,
  # requirements.run.cartographer >=2.0.0,<2.1.0a0 pulls in the real conda-forge
  # library). Its ROS package.xml build_depends still get added unconditionally
  # (see generate_output in vinca); bare lua/gflags there are unpinned and were
  # resolving to a lua newer than what the real cartographer package needs,
  # conflicting with it in the same environment. Nothing is ever built here.
  remove_host: ["lua", "gflags"]
  remove_run: ["lua", "gflags"]
