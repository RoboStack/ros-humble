[workspace]
name = "ros-humble"
description = "RoboStack repo to package ros-humble packages as conda packages"
authors = ["Tobias Fischer <tobias.fischer@qut.edu.au>", "Wolf Vollprecht <w.vollprecht@gmail.com>", "Silvio Traversaro <silvio@traversaro.it>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = [
    # 2.17 is the glibc version used in centos 7
    { platform = "linux-64", glibc = "2.17" },
    { platform = "linux-aarch64", glibc = "2.17" },
    "osx-arm64",
    "osx-64",
    "win-64",
]
preview = ["pixi-build"]

[target.win.activation.env]
PYTHONIOENCODING = "utf-8"

[dependencies]
python = ">=3.11.0,<3.12"
rattler-build = ">=0.67.0,<0.68"
setuptools = "<82.0"
rattler-index = ">=0.27.16"
curl = "*"
go-yq = "*"
colordiff = "*"

[pypi-dependencies]
# emscripten-wasm32 in platforms prevents pixi-build from resolving vinca as
# a conda source dep (uv is unavailable for that target), so use pypi here.
# Pinned to Tobias-Fischer/vinca#feature/emscripten-pthreads (PR open at
# https://github.com/RoboStack/vinca/pulls -- search "emscripten-pthreads";
# branched off master rather than the previously-pinned 4683e080a since
# this branch is now based on a current master commit) until merged
# upstream, then this should be re-pointed to the merged RoboStack/vinca
# commit. Three commits on top of master:
#  1. removes the -s DEMANGLE_SUPPORT=1 emcc flag from
#     build_ament_cmake.sh.in's emscripten branch, which emscripten 4.0.9
#     (the SDK version currently published as emscripten_emscripten-wasm32)
#     rejects outright ("No longer supported"), breaking every wasm32
#     ament_cmake build past the first one or two.
#  2. _overlay() now converts v1 if/then/else selectors in
#     pinning_overrides values into the legacy `# [selector]` comment form,
#     since rattler-build's variant loader treats the raw if/then mapping
#     as an opaque literal rather than evaluating it -- needed so the
#     python override below can differ for build- vs host-platform
#     sub-resolutions within one emscripten-wasm32 invocation.
#  3. flips USE_PTHREADS 0->1 (compile+link, globally via
#     CMAKE_PROJECT_INCLUDE) for every emscripten-wasm32 package: without
#     real threads, libc++'s condition_variable timed-wait (used by
#     rclcpp's executor / rmw wait set) never wakes on its own, hanging the
#     whole program after one spin iteration. This requires every
#     emscripten-wasm32 artifact to be rebuilt from scratch -- mixing a
#     pthread and non-pthread wasm module is a hard ABI mismatch ("memory
#     import shared state mismatch").
# (An earlier fourth commit removing -lembind from CMAKE_EXE_LINKER_FLAGS
# was tried and reverted during development -- the MAIN executable is the
# one that must provide embind's JS runtime library for side modules to
# import from, so removing it there broke embind entirely; the actual
# duplicate-registration fix belongs in the SIDE MODULE's own -lembind
# instead, via patch/ros-humble-wasm-cpp.patch in this repo. That
# try/revert pair was squashed out of the branch history before opening
# the PR, so it's not one of the three commits above.)
vinca = { git = "https://github.com/Tobias-Fischer/vinca.git", rev = "7133b302498edda9bc87a939329353fac95177c5" }
# For local development uncomment:
# vinca = { path = "../vinca", editable = true }

[target.win-64.dependencies]
# patch is required by rattler-build
m2-patch = "*"
# git is required by rattler-build
git = "*"

[tasks]
generate-recipes = { cmd = "vinca -m", depends-on = ["remove-recipes"] }
generate-gha-workflows = { cmd = "vinca-gha --trigger-branch dummy_build_branch_as_it_is_unused -d ./recipes --batch_size 10", depends-on = ["generate-recipes"] }
check-orphaned-patches = { cmd = "python check_orphaned_platform_patches.py", description = "Detect patch/ files vinca's add_package_name_variants() will never wire into any recipe because a same-package patch exists under a different name-prefix variant (see script docstring)." }
check-patches = { cmd = "python check_patches_clean_apply.py", depends-on = ["generate-recipes", "check-orphaned-patches"] }
check-deps = { cmd = "python check_dependency_compat.py", depends-on = ["generate-recipes"], description = "Solve one fake package containing every non-ROS dependency plus the mutex constraints to find pin conflicts before building anything. Run `python check_dependency_compat.py --stale` to list already-built artifacts that conflict with the current pins." }
create_snapshot = { cmd = "vinca-snapshot -d humble -o rosdistro_snapshot.yaml" }
upload = "rattler-build upload anaconda -o robostack-staging -a $ANACONDA_API_TOKEN"
build_continue_on_failure = { cmd = "rattler-build build --recipe-dir ./recipes -m ./conda_build_config.yaml -c conda-forge -c robostack-staging --continue-on-failure --skip-existing", depends-on = ["generate-recipes"] }
sort = { cmd = "vinca-sort-vinca-lists {{ check }} vinca.yaml && vinca-sort-yaml-keys {{ check }} pkg_additional_info.yaml robostack.yaml rosdistro_additional_recipes.yaml", args = [{ arg = "check", default = "" }] }

generate-recipes-emscripten = { cmd = "vinca -m --platform emscripten-wasm32", depends-on = ["remove-recipes"] }
check-patches-emscripten = { cmd = "python check_patches_clean_apply.py", depends-on = ["generate-recipes-emscripten"] }

[tasks.build]
cmd = "rattler-build build --recipe-dir ./recipes -m ./conda_build_config.yaml -c https://repo.prefix.dev/conda-forge -c robostack-staging --skip-existing"
depends-on = ["generate-recipes"]
description = "Build all packages, from the ./recipes dir. This will skip already existing packages, so it can be used to build only a subset of packages by first removing the recipes of the packages you want to rebuild (see `pixi run remove-recipes`)."

[tasks.remove-recipes]
cmd = "rm -rf recipes_only_patch; rm -rf recipes; mkdir recipes"
description = "Remove all generated recipes, before regenerating them."

[tasks.build-one]
cmd = "cp ./patch/{{ PACKAGE }}.*patch ./recipes/{{ PACKAGE }}/patch/; rattler-build build --recipe ./recipes/{{ PACKAGE }}/recipe.yaml -m ./conda_build_config.yaml -c https://repo.prefix.dev/conda-forge -c robostack-staging"
args = [{ arg = "PACKAGE", default = "ros-humble-ros-workspace" }]
description = "Build a single package, from the ./recipes dir. Add the `ros-humble-` prefix to the package name, e.g. `pixi run build-one ros-humble-ros-workspace`"

[tasks.conda-build-config-upstream-diff]
cmd = """
curl -sLo .tmp.yaml https://github.com/conda-forge/conda-forge-pinning-feedstock/raw/refs/heads/main/recipe/conda_build_config.yaml && \
yq eval 'with_entries(.value = (load(".tmp.yaml")[.key] // .value))' conda_build_config.yaml | colordiff -u conda_build_config.yaml - ;\
rm .tmp.yaml
"""
description = "Check if there are differences between the local conda_build_config.yaml and the one in the conda-forge-pinning-feedstock."

[tasks.build-emscripten]
  cmd = [
      "rattler-build", "build",
      "--package-format", "tar-bz2",
      "--recipe-dir", "./recipes",
      "-m", "./conda_build_config.yaml",
      "-c", "https://repo.prefix.dev/conda-forge",
      # https://repo.mamba.pm/emscripten-forge is stale/legacy (empty for
      # osx-arm64, ~1/3 the package count for the emscripten-wasm32 target
      # vs the channel below, as of 2026-09-07) -- emscripten-forge/recipes'
      # own pixi.toml (build-emscripten-compiler-pkg/build-cross-python-pkg
      # tasks) publishes the emscripten SDK + cross-python toolchain here.
      "-c", "https://repo.prefix.dev/emscripten-forge-4x",
      "-c", "microsoft",
      "-c", "robostack-staging",
      "--target-platform", "emscripten-wasm32",
      "--skip-existing",
      "--test", "skip"
      ]
  depends-on = ["generate-recipes-emscripten"]
