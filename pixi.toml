[workspace]
name = "ros-humble"
description = "RoboStack repo to package ros-humble packages as conda packages"
authors = ["Tobias Fischer <tobias.fischer@qut.edu.au>", "Wolf Vollprecht <w.vollprecht@gmail.com>", "Silvio Traversaro <silvio@traversaro.it>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "linux-aarch64", "win-64"]

[system-requirements]
# 2.17 is the glibc version used in centos 7
libc = { family="glibc", version="2.17" }

[dependencies]
python = ">=3.11.0,<3.12"
rattler-build = ">=0.57.0,<0.58"
setuptools = "<82.0"
rattler-index = ">=0.27.16"
sccache = "*"

[target.win-64.dependencies]
# patch is required by rattler-build
m2-patch = "*"
# git is required by rattler-build
git = "*"

[pypi-dependencies]
# Pinned to Tobias-Fischer/vinca#feature/conditional-python-dependency-v2
# (branched off upstream RoboStack/vinca master) for the multi-python-version
# experiment: only adds python/numpy/pip host+run deps to a recipe when the
# package actually needs them (ament_python, a rosidl interface package, or
# an explicit python-flavored dependency), instead of unconditionally on
# every package -- see README-multi-python.md. Also routes the ament_cmake
# and catkin build scripts' C/C++ compiler through sccache when present.
vinca = { git = "https://github.com/Tobias-Fischer/vinca.git", rev = "feature/conditional-python-dependency-v2" }
# Uncomment this line to work with a local vinca for faster iteration, but remember to comment it back
# (and regenerate the pixi.lock) once you push the modified commit to the repo
#vinca = { path = "../vinca", editable = true }

[tasks]
generate-recipes = { cmd = "vinca -m", depends-on = ["remove-recipes"] }
generate-gha-workflows = { cmd = "vinca-gha --trigger-branch dummy_build_branch_as_it_is_unused -d ./recipes", depends-on = ["generate-recipes"] }
check-patches = { cmd = "python check_patches_clean_apply.py", depends-on = ["generate-recipes"] }
create_snapshot = { cmd = "vinca-snapshot -d humble -o rosdistro_snapshot.yaml" }
upload = "rattler-build upload anaconda -o robostack-staging -a $ANACONDA_API_TOKEN"
build_continue_on_failure = { cmd = "rattler-build build --recipe-dir ./recipes -m ./conda_build_config.yaml -c conda-forge -c robostack-staging --continue-on-failure --skip-existing", depends-on = ["generate-recipes"] }

generate-recipes-emscripten = { cmd = "vinca -m --platform emscripten-wasm32", depends-on = ["remove-recipes"] }
check-patches-emscripten = { cmd = "python check_patches_clean_apply.py", depends-on = ["generate-recipes-emscripten"] }

[tasks.build]
cmd = "rattler-build build --recipe-dir ./recipes -m ./conda_build_config.yaml -c https://prefix.dev/conda-forge -c robostack-staging --skip-existing --no-build-id"
depends-on = ["generate-recipes"]
description = "Build all packages, from the ./recipes dir. This will skip already existing packages, so it can be used to build only a subset of packages by first removing the recipes of the packages you want to rebuild (see `pixi run remove-recipes`). --no-build-id keeps build directory paths stable across runs so sccache (installed by default here) can actually hit its cache."

[tasks.sccache-stats]
cmd = "sccache --show-stats"
description = "Show sccache hit-rate stats for this workspace's builds."

[tasks.remove-recipes]
cmd = "rm -rf recipes_only_patch; rm -rf recipes; mkdir recipes"
description = "Remove all generated recipes, before regenerating them."

[tasks.build-one]
cmd = "cp ./patch/{{ PACKAGE }}.*patch ./recipes/{{ PACKAGE }}/patch/; rattler-build build --recipe ./recipes/{{ PACKAGE }}/recipe.yaml -m ./conda_build_config.yaml -c https://repo.prefix.dev/conda-forge -c robostack-staging"
args = [{ arg = "PACKAGE", default = "ros-humble-ros-workspace" }]
description = "Build a single package, from the ./recipes dir. Add the `ros-humble-` prefix to the package name, e.g. `pixi run build-one ros-humble-ros-workspace`"

[tasks.build-emscripten]
  cmd = [
      "rattler-build", "build",
      "--package-format", "tar-bz2",
      "--recipe-dir", "./recipes",
      "-m", "./conda_build_config.yaml",
      "-c", "https://repo.prefix.dev/conda-forge",
      "-c", "https://repo.mamba.pm/emscripten-forge",
      "-c", "robostack-staging",
      "--target-platform", "emscripten-wasm32",
      "--skip-existing",
      "--test", "skip"
      ]
  depends-on = ["generate-recipes-emscripten"]

