# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rqt-joint-trajectory-controller
  version: 2.53.1
source:
  git: https://github.com/ros2-gbp/ros2_controllers-release.git
  tag: release/humble/rqt_joint_trajectory_controller/2.53.1-1
  target_directory: ros2-rqt-joint-trajectory-controller/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://control.ros.org
  repository: https://github.com/ros-controls/ros2_controllers
  license: Apache-2.0
  summary: Graphical frontend for interacting with joint_trajectory_controller instances.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros2-distro-mutex 0.10.* humble_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - setuptools
  run:
    - python
    - ros2-control-msgs
    - ros2-controller-manager-msgs
    - ros2-distro-mutex 0.10.* humble_*
    - ros2-python-qt-binding
    - ros2-qt-gui
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rqt-gui
    - ros2-rqt-gui-py
    - ros2-trajectory-msgs
    - rospkg
