# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-humble-ros2pkg
  version: 0.18.18
source:
  git: https://github.com/ros2-gbp/ros2cli-release.git
  tag: release/humble/ros2pkg/0.18.18-1
  target_directory: ros-humble-ros2pkg/src/work
  patches:
    - patch/ros-humble-ros2pkg.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 19
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: The pkg command for ROS 2 command line tools.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - importlib_resources
    - numpy
    - pip
    - pytest
    - pytest-timeout
    - python
    - ros-humble-ament-flake8
    - ros-humble-ament-pep257
    - ros-humble-ament-xmllint
    - ros-humble-launch
    - ros-humble-launch-testing
    - ros-humble-launch-testing-ros
    - ros-humble-ros-environment
    - ros-humble-ros-workspace
    - ros-humble-ros2cli
    - ros2-distro-mutex 0.9.* humble_*
    - setuptools
  run:
    - catkin_pkg
    - empy
    - importlib_resources
    - python
    - ros-humble-ament-copyright
    - ros-humble-ament-index-python
    - ros-humble-ros-workspace
    - ros-humble-ros2cli
    - ros2-distro-mutex 0.9.* humble_*
