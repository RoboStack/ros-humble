on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  ROS_VERSION: 2
  # Change to 'true' to enable the cache upload as artifacts
  SAVE_CACHE_AS_ARTIFACT: 'true'
  # Change to 'true' to ignore cache and force a full rebuild, but please restore to 'false' before merging
  IGNORE_CACHE_AND_DO_FULL_REBUILD: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
            folder_cache: 'output/linux-64'
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            folder_cache: 'output/linux-aarch64'
          - os: macos-15-intel
            platform: osx-64
            folder_cache: 'output/osx-64'
          - os: macos-15
            platform: osx-arm64
            folder_cache: 'output/osx-arm64'
          - os: windows-2022
            platform: win-64
            folder_cache: 'C:/bld/win-64'
          - os: ubuntu-latest
            platform: emscripten-wasm32
            folder_cache: 'output/emscripten-wasm32'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        frozen: true
        pixi-version: v0.75.0

    - name: Check sorting
      if: matrix.platform == 'linux-64'
      shell: bash -l {0}
      run: |
        pixi run sort --check

    - name: Long paths workarounds for win-64
      shell: bash -l {0}
      if: matrix.platform == 'win-64'
      run: |
        # Workaround for problem related to long paths
        echo "CONDA_BLD_PATH=C:\\bld\\" >> $GITHUB_ENV
        mkdir /c/bld

    # Workaround for https://github.com/RoboStack/ros-humble/pull/141#issuecomment-1941919816
    - name: Clean up PATH
      if: contains(matrix.os, 'windows')
      uses: egor-tensin/cleanup-path@v5
      with:
        # cygpath in C:\Program Files\Git\usr\bin is used by install micromamba
        # git in C:\Program Files\Git\bin is used by pip install git+
        dirs: 'C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin;C:\Program Files\Git\cmd;C:\Program Files\Git\mingw64\bin'

    # For some reason, the Strawberry perl's pkg-config is found
    # instead of the conda's one, so let's delete the /c/Strawberry directory
    # Furthermore, we also need to remove an older SDK that is used and can result in compilation problems
    # And we also remove the vcpkg installed in the image, to avoid that projects pick it
    - name: Remove problematic files of GitHub Actions images
      if: contains(matrix.os, 'windows')
      shell: bash -l {0}
      run: |
        rm -rf /c/Strawberry
        rm -rf "/c/Program Files (x86)/Windows Kits/10/Include/10.0.17763.0/"

    - name: Disable git auto-maintenance in source caches
      shell: bash -l {0}
      run: |
        git config --global maintenance.auto false

    - name: Generate recipes
      shell: bash -l {0}
      run: |
        set -e
        for attempt in 1 2 3; do
          rm -rf recipes
          mkdir -p recipes
          if pixi run -v vinca --platform ${{ matrix.platform }} -m -n; then
            break
          fi
          if [[ "${attempt}" == "3" ]]; then
            echo "Recipe generation failed after ${attempt} attempts" >&2
            exit 1
          fi
          echo "Recipe generation attempt ${attempt} failed; retrying..." >&2
          sleep 15
        done

    - name: Check patches
      shell: bash -l {0}
      run: |
        if [ "${{ matrix.platform }}" = "emscripten-wasm32" ]; then
          pixi run check-patches-emscripten
        else
          pixi run check-patches
        fi

    - name: Restore build cache
      id: cache-restore
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ matrix.folder_cache }}
        key: ${{ runner.os }}-${{ matrix.platform }}-pr-${{ github.event.pull_request.number }}
        # allow a later run to pick up a cache that has an extra suffix
        restore-keys: |
          ${{ runner.os }}-${{ matrix.platform }}-pr-${{ github.event.pull_request.number }}-

    - name: Optional force full rebuild
      if: ${{ env.IGNORE_CACHE_AND_DO_FULL_REBUILD == 'true' }}
      shell: bash -l {0}
      run: |
        rm -rf ${{ matrix.folder_cache }}/*

    - name: Delete specific outdated cache entries
      shell: bash -l {0}
      run: |
        # rm -rf ${{ matrix.folder_cache }}/ros-humble-autoware-trajectory* 2>/dev/null || true
        rm -rf ${{ matrix.folder_cache }}/ros-humble-async-web-server-cpp* 2>/dev/null || true
        rm -rf ${{ matrix.folder_cache }}/ros-humble-popf* 2>/dev/null || true
        # python-qt-binding itself never failed to build (only qt_gui_cpp, which
        # consumes its installed cmake/sip_helper.cmake, did), so its cached artifact
        # from before the sip_helper.cmake fix keeps getting reused by --skip-existing
        # despite the patch changes. Force it to rebuild once with the fix baked in.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-python-qt-binding* 2>/dev/null || true
        # Same story: rqt_image_overlay_layer and ros_image_to_qimage both still
        # find_package(Qt5Widgets) and export it via ament_export_dependencies, so
        # their pre-Qt6-migration builds already succeeded and got cached, silently
        # feeding Qt5 into consumers now built against Qt6 (rqt_image_overlay's
        # "INTERFACE_QT_MAJOR_VERSION property of Qt5::Core does not agree").
        rm -rf ${{ matrix.folder_cache }}/ros-humble-rqt-image-overlay-layer* 2>/dev/null || true
        rm -rf ${{ matrix.folder_cache }}/ros-humble-ros-image-to-qimage* 2>/dev/null || true
        # kdl_parser itself never failed to build historically (it only started
        # failing once orocos_kdl_vendor's exported cmake started requiring
        # eigen3_cmake_module), so its pre-fix cached artifact keeps getting
        # reused by --skip-existing despite the new dependencies.yaml host dep.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-kdl-parser* 2>/dev/null || true
        # Busting kdl_parser alone didn't fix win-64: the "Finalized host
        # dependencies" table shows ros-humble-eigen3-cmake-module correctly
        # resolved into kdl_parser's host env from the local channel, yet CMake
        # still can't find its exported Findeigen3_cmake_module.cmake -- pointing
        # at the cached eigen3-cmake-module artifact itself (restored from the
        # persistent GHA cache, built well before this fix chain) being stale or
        # bad on win-64. Force it to rebuild fresh too.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-eigen3-cmake-module* 2>/dev/null || true
        # 8e73ae0d stopped excluding rosidl_typesupport_fastrtps_c/cpp on Windows
        # (they were previously skip-listed there entirely, so rmw_fastrtps_cpp's
        # hard find_package(rosidl_typesupport_fastrtps_c REQUIRED) could never
        # have succeeded). Cached win-64 artifacts of these and their consumers
        # from before that fix are suspected of causing robot_state_publisher's
        # win-64 test crash ("Type support not from this implementation" out of
        # rmw_fastrtps_cpp during node/publisher creation). Force a clean rebuild
        # of the whole fastrtps typesupport chain plus its first real consumer.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-rosidl-typesupport-fastrtps-c* 2>/dev/null || true
        rm -rf ${{ matrix.folder_cache }}/ros-humble-rmw-fastrtps-* 2>/dev/null || true
        rm -rf ${{ matrix.folder_cache }}/ros-humble-robot-state-publisher* 2>/dev/null || true
        # NOT actually a stale-cache issue (confirmed: robot_localization's
        # win-64 build still fails LNK2019/LNK2001 on
        # geographic_msgs/geometry_msgs/builtin_interfaces fastrtps typesupport
        # symbols even after these three rebuild fully fresh, verified via the
        # "Running build for recipe" log lines, not "Skipping build"). The
        # real root cause is deeper: their rosidl_typesupport_fastrtps_c/cpp
        # libraries aren't exporting these symbols on win-64 at all, likely a
        # missing WINDOWS_EXPORT_ALL_SYMBOLS / dllexport gap in how
        # rosidl_generate_interfaces() wires up the fastrtps typesupport
        # target for MSVC -- same failure family as robot_state_publisher's
        # win-64 crash above. Left the forced-rebuild here since it's
        # harmless, but it does not fix the issue; needs an investigation
        # session with a Windows environment (or emulation) to iterate
        # against the rosidl/ament_cmake macros themselves.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-geographic-msgs* 2>/dev/null || true
        rm -rf ${{ matrix.folder_cache }}/ros-humble-geometry-msgs* 2>/dev/null || true
        rm -rf ${{ matrix.folder_cache }}/ros-humble-builtin-interfaces* 2>/dev/null || true
        # gtest_vendor itself never failed to build (its own build doesn't
        # compile gtest-death-test.cc; consuming packages with BUILD_TESTING
        # on do, from the vendored source it installs), so its pre-fix cached
        # artifact keeps getting reused by --skip-existing despite the new
        # #include <cstdint> patch.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-gtest-vendor* 2>/dev/null || true
        # sick_safetyscanners_base's own CMakeLists.txt was already patched for
        # Boost 1.90 dropping the "system" component config, but its separate,
        # manually-committed sick_safetyscanners_baseConfig.cmake (consumed by
        # downstream sick_safetyscanners2) independently declared the same
        # find_package(... COMPONENTS ... system ...) call, unpatched until now.
        # Its pre-fix cached artifact keeps getting reused by --skip-existing.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-sick-safetyscanners-base* 2>/dev/null || true
        # mutex_package.build_number (21) wasn't checked by the "already built,
        # skip" comparison (only pkg_additional_info's per-package override /
        # the top-level default build_number-20 was) until the distro_mutex
        # override was added, so any build-20 mutex artifact already sitting in
        # this cache needs to be forced out to pick up build 21's new
        # run_constraints (libboost 1.90, pcl 1.15.1, vtk 9.7.0, etc).
        rm -rf ${{ matrix.folder_cache }}/ros2-distro-mutex* 2>/dev/null || true
        # libg2o's cached artifact still has its old qt-main (Qt5) run
        # dependency baked in from before that host dep was dropped,
        # conflicting with pcl's qt6-main requirement (confirmed on jazzy
        # with the identical fix -- same upstream source). Force a fresh
        # rebuild without it.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-libg2o* 2>/dev/null || true
        # Same corrupt-cache pattern seen on jazzy win-64 (~20-25KB packages
        # that fail downstream "package not found" checks despite being
        # present locally): ros-humble-lanelet2-core on win-64, only ~20KB.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-lanelet2-core* 2>/dev/null || true
        # ros-humble-coal's generated dummy-package run-constraint was stale
        # at "coal >=3.0.3,<3.0.4a0" (pkg_additional_info.yaml override_version),
        # capping it below the libcoal >=3.0.4 that pinocchio 4.1.0 and
        # eigenpy 3.13.0 need from conda-forge -- this made
        # ros-humble-pinocchio's test-environment solve unsatisfiable
        # (confirmed via full recipe resolution in a local multipass VM).
        # Force both to rebuild fresh with the corrected 3.0.4 pin.
        rm -rf ${{ matrix.folder_cache }}/ros-humble-coal* 2>/dev/null || true
        rm -rf ${{ matrix.folder_cache }}/ros-humble-pinocchio* 2>/dev/null || true
        mkdir -p ${{ matrix.folder_cache }}
        pixi run rattler-index fs ${{ matrix.folder_cache }}/.. --force

    - name: See packages restored by cache
      shell: bash -l {0}
      run: |
        ls ${{ matrix.folder_cache }} || true

    - name: Build recipes
      id: build-recipes
      shell: bash -l {0}
      run: |
        if [ "${{ matrix.platform }}" = "emscripten-wasm32" ]; then
          pixi run rattler-build build --recipe-dir recipes --target-platform ${{ matrix.platform }} -m ./conda_build_config.yaml -c https://repo.mamba.pm/emscripten-forge/ -c conda-forge -c robostack-staging --skip-existing --test skip
        else
          # Without this, resolvo's strict channel priority can refuse a
          # just-built local package outright once any other-channel build of
          # the same name exists, even when the local one is the only valid
          # option (confirmed via a peer session on rolling, and hit here on
          # jazzy's ros2-pinocchio test step excluding its own freshly-built
          # local .conda and falling back through an unrelated,
          # unsatisfiable dependency chain instead).
          pixi run rattler-build build --recipe-dir recipes --target-platform ${{ matrix.platform }} -m ./conda_build_config.yaml -c conda-forge -c robostack-staging --skip-existing --channel-priority disabled
        fi

    - name: See packages that will be saved in cache
      shell: bash -l {0}
      if: always()
      run: |
        ls ${{ matrix.folder_cache }} || true

    - name: Save build cache
      uses: actions/cache/save@v5
      # Save partial output when the build fails or is cancelled by the job timeout; do not save when it was skipped.
      if: ${{ always() && (steps.build-recipes.outcome == 'success' || steps.build-recipes.outcome == 'failure' || steps.build-recipes.outcome == 'cancelled') }}
      with:
        path: |
          ${{ matrix.folder_cache }}
        key: ${{ runner.os }}-${{ matrix.platform }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Generate GitHub Actions workflows to catch post-PR problems
      shell: bash -l {0}
      run: |
        pixi run vinca-gha --platform ${{ matrix.platform }} --trigger-branch dummy_build_branch_as_it_is_unused -d ./recipes

    - name: Upload build cache as artifact
      # Keep artifacts consistent with the cache: retain partial output from failed or cancelled builds, but not skipped builds.
      if: ${{ always() && env.SAVE_CACHE_AS_ARTIFACT == 'true' && (steps.build-recipes.outcome == 'success' || steps.build-recipes.outcome == 'failure' || steps.build-recipes.outcome == 'cancelled') }}
      uses: actions/upload-artifact@v6
      with:
        name: cache-${{ matrix.platform }}-${{ github.run_id }}
        path: ${{ matrix.folder_cache }}
        retention-days: 7
