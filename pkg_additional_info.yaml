py_trees:
  generate_dummy_package_with_run_deps:
    dep_name: py-trees
    max_pin: 'x.x.x'
    override_version: '2.5.0'
pybind11_json_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR"
pybind11_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR"
rtabmap:
  # GTSAM's exported tbb_allocator template collides with rtabmap's own instantiation on MSVC (LNK2005); g2o/Ceres remain as optimizer backends.
  additional_cmake_args:
    if: win
    then: "-DWITH_QT=OFF -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF -DWITH_GTSAM=OFF"
    else: "-DWITH_QT=OFF -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF"
sbg_driver:
  # M_PI/M_SQRT2 are only defined on MSVC when _USE_MATH_DEFINES is set before <cmath> is first included.
  additional_cmake_args:
    if: win
    then: '-DCMAKE_CXX_FLAGS="-D_USE_MATH_DEFINES"'
