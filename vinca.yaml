ros_distro: humble

package_name_mode: both

# mapping for package keys
conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Reminder for next full rebuild, the next build number should be 21
build_number: 20

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.10.0"
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 7.35.1.*
    - vtk 9.7.0.*
    - krb5 1.22.*

patch_dir: patch
rosdistro_snapshot: rosdistro_snapshot.yaml
rosdistro_additional_recipes: rosdistro_additional_recipes.yaml

skip_existing:
  - https://conda.anaconda.org/robostack-staging/

packages_skip_by_deps:

  - if: not linux
    then:
      - ament_cmake_xmllint
      - ament_xmllint
      - mimick_vendor
      - mujoco_ros2_control
      - mujoco_ros2_control_demos
      - mujoco_vendor
      - osrf_testing_tools_cpp
      - pendulum_control
      - performance_test_fixture
      - rclc_examples
      - rmw_connextdds
      - tlsf
      - tlsf_cpp

  # Gazebo Classic packages unavailable on Windows (libprotobuf pin conflict); robot_localization pulled in transitively via clearpath_control.
  - if: win
    then:
      - gz_ros2_control
      - gz_ros2_control_demos
      - robot_localization
      - ros_gz_sim
      - ros_gz_sim_demos
      - ros_ign_gazebo  # legacy-name counterpart of ros_gz_sim, not merely a dependent of it
      - ros_ign_gazebo_demos
      - ros_ign_image  # Modern gz-sim integration is unsupported on Humble Windows; see issue #68.
      - rttest
      - test_ros_gz_bridge
      - velodyne_gazebo_plugins  # links Gazebo Classic's Ogre libs; win-64 is missing OgreBites.lib

  - as2_behaviors_trajectory_generation  # nested FetchContent'd NLopt violates CMake 4's minimum version floor; too fragile to patch, skip for now

packages_remove_from_deps:

  - if: not linux
    then:
      - ament_cmake_xmllint
      - ament_xmllint
      - mimick_vendor
      - mujoco_ros2_control
      - mujoco_ros2_control_demos
      - mujoco_vendor
      - osrf_testing_tools_cpp
      - pendulum_control
      - performance_test_fixture
      - rclc_examples
      - rmw_connextdds
      - tlsf
      - tlsf_cpp

  # Strip these from any other recipe's deps too, matching the packages_skip_by_deps exclusion above (avoids dangling refs from direct dependents).
  - if: win
    then:
      - gz_ros2_control
      - gz_ros2_control_demos
      - robot_localization
      - ros_gz_sim
      - ros_gz_sim_demos
      - ros_ign_gazebo
      - ros_ign_gazebo_demos
      - ros_ign_image
      - rttest
      - test_ros_gz_bridge
      - velodyne_gazebo_plugins

