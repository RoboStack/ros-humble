ros_distro: humble

# mapping for package keys
conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Reminder for next full rebuild, the next build number should be 21
build_number: 20

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.10.0"
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 6.33.5.*
    - vtk 9.6.2.*
    - krb5 1.22.*

patch_dir: patch
rosdistro_snapshot: rosdistro_snapshot.yaml
rosdistro_additional_recipes: rosdistro_additional_recipes.yaml

skip_existing:
  - https://conda.anaconda.org/robostack-staging/

packages_skip_by_deps:

  - if: not linux
    then:
      - ament_cmake_xmllint
      - ament_xmllint
      - mimick_vendor
      - mujoco_ros2_control
      - mujoco_ros2_control_demos
      - mujoco_vendor
      - osrf_testing_tools_cpp
      - pendulum_control
      - performance_test_fixture
      - rclc_examples
      - rmw_connextdds
      - tlsf
      - tlsf_cpp

  # Dependencies unavailable when targeting WebAssembly.
  - if: wasm32
    then:
      - rmw_connextdds
      - rmw_cyclonedds_cpp
      - rmw_fastrtps_cpp
      - rmw_fastrtps_dds_common
      - rmw_fastrtps_dynamic_cpp
      - rmw_fastrtps_shared_cpp
      - ros_gz
      - ros_gz_bridge
      - ros_gz_image
      - ros_gz_sim
      - ros_gz_sim_demos
      - ros_ign
      - ros_ign_bridge
      - ros_ign_gazebo

  # Dependencies unavailable on Windows.
  - if: win
    then:
      - ros_ign_gazebo_demos
      - ros_ign_image  # Modern gz-sim integration is unsupported on Humble Windows; see issue #68.
      - rosidl_typesupport_fastrtps_c
      - rosidl_typesupport_fastrtps_cpp
      - rttest
      - test_ros_gz_bridge

packages_remove_from_deps:

  - if: not linux
    then:
      - ament_cmake_xmllint
      - ament_xmllint
      - mimick_vendor
      - mujoco_ros2_control
      - mujoco_ros2_control_demos
      - mujoco_vendor
      - osrf_testing_tools_cpp
      - pendulum_control
      - performance_test_fixture
      - rclc_examples
      - rmw_connextdds
      - tlsf
      - tlsf_cpp

  # Dependencies unavailable when targeting WebAssembly.
  - if: wasm32
    then:
      - rmw_connextdds
      - rmw_cyclonedds_cpp
      - rmw_fastrtps_cpp
      - rmw_fastrtps_dds_common
      - rmw_fastrtps_dynamic_cpp
      - rmw_fastrtps_shared_cpp
      - ros_gz
      - ros_gz_bridge
      - ros_gz_image
      - ros_gz_sim
      - ros_gz_sim_demos
      - ros_ign
      - ros_ign_bridge
      - ros_ign_gazebo

  # Dependencies unavailable on Windows.
  - if: win
    then:
      - ros_ign_gazebo_demos
      - ros_ign_image  # Modern gz-sim integration is unsupported on Humble Windows; see issue #68.
      - rosidl_typesupport_fastrtps_c
      - rosidl_typesupport_fastrtps_cpp
      - rttest
      - test_ros_gz_bridge

